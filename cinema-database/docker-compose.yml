services:
  db:
    image: mariadb:11.4
    container_name: cinema-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: cinema
      MARIADB_USER: cinema
      MARIADB_PASSWORD: cinema
    ports:
      - "33063:3306"
    volumes:
      - cinema_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: cinema-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"

  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cinema_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]


volumes:
  cinema_db_data:
  cinema_redis_data:
